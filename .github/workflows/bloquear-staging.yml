name: Bloquear merge da staging em outras branches

on:
  workflow_call:
    inputs:
      base_ref:
        description: 'Branch de destino do PR (github.base_ref)'
        required: false
        type: string
        default: ''

jobs:
  bloquear-merge-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Necessário para buscar histórico completo

      - name: Buscar branch staging
        run: git fetch origin staging

      - name: Verificar se staging foi mesclada nesta branch
        env:
          # Usa o input passado pelo workflow chamador, ou o github.base_ref direto
          BASE_BRANCH: ${{ inputs.base_ref || github.base_ref || '' }}
        run: |
          echo "📌 Branch de destino (base_ref): '$BASE_BRANCH'"
          
          # Se o PR está sendo aberto PARA a staging, não há problema
          if [ "$BASE_BRANCH" = "staging" ]; then
            echo "✅ PR direcionado para staging. Verificação não aplicável."
            exit 0
          fi
          
          # Se não conseguimos determinar a branch de destino, mostramos aviso mas não bloqueamos
          if [ -z "$BASE_BRANCH" ]; then
            echo "⚠️  Não foi possível determinar a branch de destino."
            echo "   Certifique-se de passar 'base_ref: \${{ github.base_ref }}' ao chamar este workflow."
            echo "   Continuando com a verificação..."
          fi

          STAGING_SHA=$(git rev-parse origin/staging)

          # Lista commits de merge feitos após o estado atual da staging
          if git rev-list --merges --parents origin/staging..HEAD | grep "$STAGING_SHA"; then
            echo "❌ Esta branch contém merge da branch 'staging'."
            echo "   Não é permitido trazer código da staging para outras branches."
            exit 1
          fi

          echo "✅ Nenhum merge indevido com 'staging' foi encontrado."
