name: Maven Build

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: '17'
      maven-args:
        required: false
        type: string
        default: '-B package --file pom.xml'
    # Agora pedimos o PAT ao invés das credenciais do App
    secrets:
      CICD_MAVEN_PAT:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          server-id: github # Mantém o padrão
          server-username: fabriciobs # Seu usuário fixado
          server-password: MAVEN_PAT # Nome da variável que o Maven vai ler
          settings-path: ${{ github.workspace }}

      - name: Build com Maven
        run: mvn -s $GITHUB_WORKSPACE/settings.xml ${{ inputs.maven-args }}
        env:
          # Injetamos o secret na variável que o setup-java configurou
          MAVEN_PAT: ${{ secrets.CICD_MAVEN_PAT }}