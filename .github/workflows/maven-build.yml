name: Maven Build

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: '17'
      maven-args:
        required: false
        type: string
        default: '-B package --file pom.xml'

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          server-id: github-cpb-libs
          # 1. CHUMBADO: Seu usuário dono do PAT inserido diretamente aqui
          server-username: fabriciobs 
          # 2. VARIÁVEL: Nome da variável que o setup-java vai ler
          server-password: MAVEN_PASSWORD 
          settings-path: ${{ github.workspace }}

      - name: Build com Maven
        run: mvn -s $GITHUB_WORKSPACE/settings.xml ${{ inputs.maven-args }}
        env:
          # 3. INJEÇÃO: Consome o Secret da Organização que foi passado pelo "secrets: inherit"
          MAVEN_PASSWORD: ${{ secrets.CPB_PACKAGES_READ_TOKEN }}
